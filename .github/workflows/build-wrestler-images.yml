name: Build NMU Wrestler Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow rembg onnxruntime

      - name: Build wrestler images
        run: python scripts/build_wrestler_images.py

      - name: Commit generated assets
        run: |
          git config user.name "NMU Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add wrestlers/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build NMU wrestler image assets"
            git push
          fi
